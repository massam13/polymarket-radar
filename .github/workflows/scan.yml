name: Scan Polymarket

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub peut décaler de quelques minutes ; la fenêtre de 60 min absorbe les retards
  workflow_dispatch:
    inputs:
      lookback:
        description: "Minutes à relire"
        default: "60"
      min_score:
        description: "Seuil d'alerte (60 en temps normal ; baisser pour tester)"
        default: "60"
      dry_run:
        description: "Test : n'envoie aucune alerte"
        type: boolean
        default: false

permissions:
  contents: write   # pour enregistrer state/ (dédoublonnage + historique des alertes)

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RADAR_MIN_SCORE: ${{ inputs.min_score || '60' }}
        run: python -m radar --lookback "${{ inputs.lookback || 60 }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Enregistrer l'état
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "polymarket-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          git pull --rebase && git push
